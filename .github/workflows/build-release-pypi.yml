name: PyPI Builder and Releaser

on:
  push:
    tags:
      - "**"

jobs:
  publish-pypi:
    name: Publishes release candidate to PyPI
    runs-on: ubuntu-latest
    steps:
      - name: Pulls the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Sets up Python 3.8
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.8
      - name: Installs pypa/build
        shell: bash -l {0}
        run: |
          python -m pip install build --user
      - name: Builds the wheel
        shell: bash -l {0}
        run: |
          python -m build --sdist --wheel --outdir dist/ .
      - name: Publishes to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
